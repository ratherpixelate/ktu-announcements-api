[project]
name = "ktu-announcements-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "camoufox[geoip]>=0.4.11",
    "fastapi>=0.142.4",
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
